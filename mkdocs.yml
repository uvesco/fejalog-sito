# Il sito di appoggio di Fejalog: sorgenti qui, in fejalog/sito; pubblicato dal repository
# pubblico uvesco/fejalog-sito con strumenti/pubblica_sito.sh. Le pagine della guida di riferimento, le Novità e il
# foglio per i veterinari li scrive `./gradlew :shared:scriviSito` dai testi dell'app (anche il pezzo di menu fra i
# marcatori qui sotto). Prova in locale: sito/.venv/bin/mkdocs serve -f sito/mkdocs.yml
site_name: Fejalog
site_description: Le provette della profilassi brucellosi ovicaprina, registrate in campo con più device, fino ad ARVET.
site_url: https://uvesco.github.io/fejalog-sito/
# niente repo_url: il tema, con il collegamento al repository, chiede le statistiche a api.github.com (nessuna risorsa esterna nel sito)
copyright: Fejalog · Umberto Vesco · dati di esempio inventati (stabilimento 888TO999)

theme:
  name: material
  language: it
  font: false            # niente Google Fonts: caratteri del sistema
  logo: img/icona.png
  favicon: img/icona.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.highlight
    - toc.follow
    - content.code.copy

extra_css:
  - stili/fejalog.css
  - strumenti/css/strumenti.css

extra_javascript:
  - strumenti/js/barra.js

plugins:
  - search:
      lang: it

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys

